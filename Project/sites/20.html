<html> 
 <head> 
  <title>Employee Registration Web Page</title> 
 </head> 
 
 <body> 
 
 <video width="300" height="300" controls> 
                <source src="not so still world.mp4" type="video/mp4"> 
        </video> 
 <br> 
 <form> 
  <label for="fname">Full Name</label> 
  <input type="text" id="fname" name="fname" placeholder="Full Name"><br> 
   
  <label for="eid">Employee ID</label> 
  <input type="text" id="eid" name="eid" placeholder="Employee ID" 
minlength="3" maxlength="12" pattern="A[0-9]{2,10}" required><br> 
 
  <label for="email">Email Address</label> 
  <input type="email" id="email" name="email" placeholder="Email"><br> 
  
  <label for="pass">Password</label> 

  <input type="password" id="pass" name="pass" placeholder="Password"><br> 
  <label for="con">Confirm Password</label> 
                <input type="password" id="con" name="con" placeholder="Confirm Password"><br> 
  
  <label for="dob">DOB</label> 
  <input type="date" id="dob" name="dob"/><br> 
  
  <label>Gender</label><br> 
  <input type="radio" id="male" name="gender" value="Male"> 
  <label for="male">Male</label><br> 
  <input type="radio" id="female" name="gender" value="Female"> 
  <label for="female">Female</label><br> 
  <label for="dept">Department</label> 
  <select id="dept" name="dept"> 
   <option value="HR">HR</option> 
   <option value="QA">QA</option> 
  </select><br> 
  <label for="skills">Skills</label><br> 
  <input type="checkbox" id="skill1" name="skill1" value="HTML"> 
  <label for="skill1">HTML</label><br> 
  <input type="checkbox" id="skill2" name="skill2" value="CSS"> 
  <label for="skill2">CSS</label><br> 
  <input type="checkbox" id="skill3" name="skill3" value="Javascript"> 
  <label for="skill3">Javascript</label><br> 
   
  <label for="number">Mobile No</label> 
  <input type="tel" name="number" id="number" placeholder="Phone no"><br> 
  
  <label for="upload">Photo</label> 
  <input type="file" id="upload" name="upload" accept="image/*"/> 
  <br>  
  <input type="submit" value="Submit"><br> 
  <input type="reset" value="Reset"> 
 </form> 
 
  
 </body> 
</html>
