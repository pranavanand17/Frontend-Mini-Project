<!DOCTYPE html> 
<html> 
<head> 
<style> 
header { 
    background: #333; 
    display: flex; 
    justify-content: space-between; 
    padding: 20px; 
} 
 
h1 { 
    color: white; 
} 
 
div { 
    display: flex; 
    gap: 10px; 
} 
 
input, select, button { 
    padding: 10px; 
    border-radius: 5px; 
} 
 
button:hover { 

    background: #ccc; 
} 
</style> 
</head> 
 
<body> 
 
<header> 
    <h1>Smart Search Engine</h1> 
 
    <div> 
        <input placeholder="Search products, services, or articles..."> 
 
        <select> 
            <option>All Categories</option> 
            <option>Electronics</option> 
            <option>Books</option> 
            <option>Clothing</option> 
            <option>Groceries</option> 
        </select> 
 
        <select> 
            <option>Any Price</option> 
            <option>Under ₹500</option> 
            <option>₹500 – ₹2,000</option> 
            <option>Above ₹2,000</option> 
        </select> 
 
        <button>Search</button> 
    </div> 
</header> 
 
</body> 
</html>
