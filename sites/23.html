<html>
<head>
    <title>Patient Registration Form</title>
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe, #bfdbfe);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }
        form {

            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group-row {
            display: flex;
            flex-direction: row;
            gap: 15px;
            align-items: center;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select, textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="radio"], input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button, input[type="submit"], input[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="submit"] {
            background-color: #2563eb;
            color: white;
        }
        input[type="reset"] {
            background-color: #ef4444;
            color: white;
        }
        input[type="image"] {
            width: auto;
            max-height: 40px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <form action="#" method="POST">
        
        <input type="hidden" name="patient_id" value="PT-98765">
        <div class="form-group">
            <label for="name">Patient Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="tel">Contact Number:</label>
            <input type="tel" id="tel" name="tel" required>
        </div>
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="0" max="120">
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </div>
        <div class="form-group">
            <label for="time">Appointment Time:</label>
            <input type="time" id="time" name="time">
        </div>
        <div class="form-group">
            <label for="datetime">Appointment Date & Time:</label>
            <input type="datetime-local" id="datetime" name="datetime">
        </div>
        <div class="form-group">
            <label for="url">Personal Website/Reference:</label>
            <input type="url" id="url" name="url">
        </div>
        <div class="form-group">
            <label for="search">Search Doctor:</label>
            <input type="search" id="search" name="search">
        </div>
        <div class="form-group">
            <label for="color">Favorite Consultation Color Theme:</label>
            <input type="color" id="color" name="color" value="#2563eb">
        </div>
        <div class="form-group">
            <label for="file">Medical Record Upload:</label>
            <input type="file" id="file" name="file">
        </div>
        <div class="form-group">
            <label for="range">Pain Level (0-10):</label>
            <input type="range" id="range" name="range" min="0" max="10" value="5">
        </div>
        <div class="form-group">
            <label>Gender:</label>
            <div class="form-group-row">
                <label><input type="radio" name="gender" value="male"> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
                <label><input type="radio" name="gender" value="other"> Other</label>
            </div>
        </div>
        <div class="form-group">
            <label>Known Allergies:</label>
            <div class="form-group-row">
                <label><input type="checkbox" name="allergies" value="food"> Food</label>
                <label><input type="checkbox" name="allergies" value="medication"> 
Medication</label>
                <label><input type="checkbox" name="allergies" value="environment"> 
Environment</label>
            </div>
        </div>
        <div class="form-group">
            <label for="blood_group">Blood Group:</label>
            <select id="blood_group" name="blood_group">
                <option value="">Select...</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
        </div>
        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Pay / Confirm via Partner Link:</label>
            <input type="image" src="https://placeholder.com" alt="Online Payment">
        </div>
        <div class="buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>
</div>
</body>
</html>
