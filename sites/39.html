<html> 
<head> 
    <title>Travel Photo Gallery</title> 
    <style> 
        body { 
            font-family: sans-serif; 
            background-color: #ffffff; 
            color: #000000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        } 
        .gallery-container { 
            max-width: 500px; 
            width: 100%; 
            text-align: center; 
            padding: 20px; 
        } 
        .image-box { 
            width: 100%; 
            height: 300px; 
            border: 1px solid #000000; 
            display: block; 
            object-fit: cover; 
            background-color: #fafafa; 
        } 
        #message { 
            margin-top: 20px; 
            font-size: 14px; 
            min-height: 20px; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        } 
    </style> 
</head> 
<body> 
 
<div class="gallery-container"> 
    <img id="imageDisplay" class="image-box" src="paris.jpg"> 
    <div id="message"></div> 
</div> 
 
<script> 
    const imageDisplay = document.getElementById('imageDisplay'); 
    const messageDiv = document.getElementById('message'); 
     
    const items = [ 
        { src: "osaka.jpg", name: "Osaka, Japan" }, 
        { src: "mtfuji.jpg", name: "Mt Fuji, Japan" }, 
        { src: "sendai.jpg", name: "Sendai, Japan" } 
    ]; 
     
    let currentIndex = 0; 
 
    function updateGallery() { 
        imageDisplay.src = items[currentIndex].src; 
        messageDiv.textContent = ""; 
    } 
 
    document.addEventListener('keydown', function(event) { 
        if (event.key === 'n' || event.key === 'N') { 
            currentIndex = (currentIndex + 1) % items.length; 
            updateGallery(); 
        } else if (event.key === 'p' || event.key === 'P') { 
            currentIndex = (currentIndex - 1 + items.length) % items.length; 
            updateGallery(); 
        } else if (event.key === ' ') { 
            event.preventDefault(); 
            messageDiv.textContent = items[currentIndex].name; 
        } 
    }); 
</script> 
 
</body> 
</html>
